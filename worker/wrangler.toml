# Cloudflare Worker 배포 설정 (GitHub Actions에서 자동 배포)
name = "handcal"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# 대시보드에서 넣은 변수(ALLOWED_ORIGIN 등)를 배포할 때 지우지 않음. 비밀값은 원래 유지됨
keep_vars = true

# 손글씨 정밀 다듬기는 안티그래비티 스케줄(window.argonRefine)이 맡는다.
# 서버에서 유료 모델(Gemini Pro)로 매일 돌리려면 crons = ["0 18 * * *"](03:00 KST)로 바꾸고, 앱에서 registerRefineToken()을 불러 토큰을 등록한다.
# 빈 목록이면 배포할 때 기존 예약도 지운다.
[triggers]
crons = []

# (선택) 대시보드에서 KV 네임스페이스를 만들고 HANDCAL_KV로 바인딩하면 리프레시 토큰·캘린더 목록을 영구 보관함
# [[kv_namespaces]]
# binding = "HANDCAL_KV"
# id = "..."

