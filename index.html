<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>필기 캘린더</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="필기캘린더">
<script>
  try {
    const t = JSON.parse(localStorage.getItem('theme') || '"auto"');
    if (t !== 'auto') document.documentElement.dataset.theme = t;
    document.documentElement.style.setProperty('--ui-scale', JSON.parse(localStorage.getItem('uiScale') || '1'));
  } catch (e) { /* 저장소 사용 불가 */ }
  // 화면 크기·기기 종류로 기본 글자 크기 자동 결정 (app.js의 autoFontPx와 같은 식)
  (function () {
    const coarse = matchMedia('(pointer: coarse)').matches;
    const f = 10.5 + 0.0075 * Math.sqrt(innerWidth * innerHeight) + (coarse ? 1 : -1.5);
    document.documentElement.style.setProperty('--fs-base', Math.max(14, Math.min(20, f)).toFixed(2) + 'px');
  })();
</script>
<link rel="stylesheet" href="style.css?v=14">
<script src="config.js?v=14"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="vendor/perfect-freehand.js?v=14"></script>
<script src="app.js?v=14" defer></script>
</head>
<body>
<header class="topbar">
  <div id="month-nav" class="nav">
    <button id="prev-month" class="arrow" aria-label="이전 달">‹</button>
    <h1 id="month-title"></h1>
    <button id="next-month" class="arrow" aria-label="다음 달">›</button>
    <button id="today-btn" class="pill">오늘</button>
  </div>
  <div id="day-nav" class="nav hidden">
    <button id="back-btn" class="pill">‹ 달력</button>
    <button id="prev-day" class="arrow" aria-label="이전 날">‹</button>
    <h1 id="day-title"></h1>
    <button id="next-day" class="arrow" aria-label="다음 날">›</button>
  </div>
  <div class="right">
    <span id="sync-status" class="status"></span>
    <button id="auth-btn" class="pill primary">구글 로그인</button>
    <div class="settings-wrap">
      <button id="settings-btn" class="pill" aria-label="설정" aria-expanded="false">⚙</button>
      <div id="settings" class="settings hidden" role="dialog" aria-label="설정">
        <div class="settings-row">
          <span class="settings-label">글자 크기 (화면에 맞춰 자동 · 필요하면 보정)</span>
          <div class="seg">
            <button id="font-down" aria-label="글자 작게">가−</button>
            <button id="font-size-label" tabindex="-1">100%</button>
            <button id="font-up" aria-label="글자 크게">가+</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label">화면 모드</span>
          <div class="seg" id="theme-seg">
            <button data-theme="auto">자동</button>
            <button data-theme="light">라이트</button>
            <button data-theme="dark">다크</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <section id="month-view">
    <div class="weekdays">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="day-view" class="hidden">
    <div class="toolbar">
      <div class="group">
        <button class="tool active" data-tool="pen">펜</button>
        <button class="tool" data-tool="hl">형광펜</button>
        <button class="tool" data-tool="eraser">지우개</button>
      </div>
      <div class="group" id="colors"></div>
      <div class="group" id="sizes"></div>
      <div class="group">
        <button id="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">↶</button>
        <button id="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행">↷</button>
      </div>
      <div class="group">
        <button id="finger-mode" class="pill"></button>
        <button id="clear" class="pill danger">전체 지우기</button>
      </div>
    </div>
    <div class="day-body">
      <aside class="events-panel">
      <details id="events-panel" open>
        <summary id="events-summary">일정</summary>
        <ul id="event-list"></ul>
        <form id="event-form" autocomplete="off">
          <input id="ev-title" placeholder="메모 일정 입력 (네이버에는 저장 안 됨)" required>
          <div class="ev-row">
            <label><input type="checkbox" id="ev-allday" checked> 종일</label>
            <span id="ev-times" class="hidden">
              <input type="time" id="ev-start" value="09:00"> ~ <input type="time" id="ev-end" value="10:00">
            </span>
            <button type="submit" class="pill primary">추가</button>
          </div>
        </form>
      </details>
      <details id="ocr-panel" open>
        <summary>필기 → 글자 (AI)</summary>
        <div class="ocr-actions">
          <button id="ocr-btn" class="pill primary">글자로 변환</button>
          <button id="ocr-copy" class="pill hidden">복사</button>
        </div>
        <p id="ocr-hint" class="muted-text">손글씨를 글자로 옮기고 요약·할 일을 정리해요.</p>
        <div id="ocr-result" class="hidden">
          <div id="ocr-summary"></div>
          <label class="ocr-label" for="ocr-text">원문 (직접 고칠 수 있어요)</label>
          <textarea id="ocr-text" rows="8"></textarea>
        </div>
      </details>
      </aside>
      <div id="page-scroll" class="page-scroll">
        <div class="page-wrap">
          <canvas id="canvas"></canvas>
          <canvas id="overlay"></canvas>
          <div id="loading" class="loading hidden">불러오는 중…</div>
        </div>
        <button id="add-page" class="pill">+ 페이지 늘리기</button>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
</body>
</html>
